[pytest]
asyncio_default_fixture_loop_scope = function
# Keep all pytest temporary artifacts inside the repository. This avoids a
# Windows ACL/locked-directory failure under %LOCALAPPDATA%\Temp\pytest-of-... .
cache_dir = .pytest-cache-creativeiq
addopts = -m "not integration" --basetemp=.pytest-tmp-creativeiq
markers =
    integration: requires configured external AI credentials and network access
